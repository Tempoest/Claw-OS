<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Claw OS — Web Demo</title>
        <style>
            body {
                background-color: #0f111a;
                color: #e0e6ed;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                padding: 20px;
            }

            h1 {
                margin-bottom: 5px;
                color: #ff6b35;
                letter-spacing: 1px;
            }

            p {
                margin-top: 0;
                color: #8892b0;
                font-size: 14px;
            }

            #terminal-container {
                border: 3px solid #2e3440;
                border-radius: 8px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
                background-color: #000;
                overflow: hidden;
                position: relative;
            }

            /* Выравнивание текстового экрана VGA */
            #screen_container {
                white-space: pre;
                font-family: monospace;
                font-size: 14px;
                line-height: 14px;
            }

            canvas {
                display: block;
            }

            .controls {
                margin-top: 15px;
                display: flex;
                gap: 10px;
            }

            button {
                background-color: #ff6b35;
                color: #fff;
                border: none;
                padding: 8px 16px;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
                transition: background 0.2s;
            }

            button:hover {
                background-color: #e85a24;
            }
        </style>

        <!-- Загружаем библиотеки v86 напрямую через CDN -->
        <script src="https://copy.sh/v86/build/libv86.js"></script>
    </head>
    <body>
        <h1>🦀 Claw OS</h1>
        <p>
            Bare-metal x86_64 Kernel written in Rust running in WebAssembly
            (v86)
        </p>

        <div id="terminal-container">
            <!-- Сюда v86 встроит canvas/VGA экран -->
            <div id="screen_container"></div>
        </div>

        <div class="controls">
            <button onclick="restart()">Перезапустить</button>
            <button onclick="fullscreen()">На весь экран</button>
        </div>

        <script>
            var emulator = null;

            window.onload = function () {
                emulator = new V86Starter({
                    // Загрузка компонентов эмулятора через CDN
                    wasm_path: "https://copy.sh/v86/build/v86.wasm",
                    memory_size: 128 * 1024 * 1024, // 128 МБ RAM для ядра
                    vga_memory_size: 2 * 1024 * 1024,
                    screen_container:
                        document.getElementById("screen_container"),

                    // Стандартные биосы для x86 из CDN
                    bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
                    vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },

                    // ВАЖНО: Укажите точное имя или путь к вашему .img файлу
                    fda: { url: "./claw-os.img" }, // Если это образ дискеты / жесткого диска, можно изменить `fda` на `hda`

                    autostart: true,
                });
            };

            function restart() {
                if (emulator) {
                    emulator.restart();
                }
            }

            function fullscreen() {
                var container = document.getElementById("terminal-container");
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                }
            }
        </script>
    </body>
</html>
